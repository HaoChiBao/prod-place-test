<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swappable objects</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.4 "Segoe UI", sans-serif;
      background: #12141a;
      color: #f2f4f8;
    }
    header { padding: 16px 20px 8px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.note { margin: 0; color: #a8b0c0; font-size: 13px; }
    main { display: grid; grid-template-columns: 280px 1fr; gap: 16px; padding: 12px 20px 24px; }
    .clips, .objects { display: flex; flex-direction: column; gap: 8px; }
    button.clip, button.obj {
      text-align: left;
      background: #1c2030;
      color: inherit;
      border: 1px solid #2c3348;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
    }
    button.clip[aria-pressed="true"], button.obj[aria-pressed="true"] {
      border-color: #f5c518;
      background: #2a2614;
    }
    button .meta { display: block; color: #a8b0c0; font-size: 12px; margin-top: 2px; }
    .stage { position: relative; width: min(100%, 960px); background: #000; }
    video { display: block; width: 100%; height: auto; background: #000; }
    .box {
      position: absolute;
      border: 2px solid #f5c518;
      box-shadow: 0 0 0 1px rgba(0,0,0,.6);
      pointer-events: none;
    }
    .box span {
      position: absolute;
      left: 0;
      top: -22px;
      background: #f5c518;
      color: #1a1400;
      font-size: 12px;
      font-weight: 650;
      padding: 1px 6px;
      white-space: nowrap;
    }
    .swap {
      width: min(100%, 960px);
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .swap h2 { font-size: 15px; margin: 0; }
    .swap label { display: flex; flex-direction: column; gap: 4px; color: #a8b0c0; font-size: 12px; }
    .swap input[type="text"], .swap input[type="file"] {
      background: #1c2030;
      color: inherit;
      border: 1px solid #2c3348;
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    button.go {
      background: #f5c518;
      color: #1a1400;
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      font: inherit;
      font-weight: 650;
      width: fit-content;
      cursor: pointer;
    }
    button.go:disabled { opacity: 0.55; cursor: default; }
    #swap-status { margin: 0; min-height: 1.2em; }
    .compare {
      width: min(100%, 960px);
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .compare figcaption { color: #a8b0c0; font-size: 12px; margin-bottom: 4px; }
    .compare figure { margin: 0; }
    .empty { color: #a8b0c0; }
    .objects { margin-top: 12px; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      .compare { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Swappable objects</h1>
    <p class="note">Pick a clip and an object. Name the product to put in its place, and the swap plays beside the original.</p>
  </header>
  <main>
    <section>
      <div class="clips" id="clips"></div>
    </section>
    <section>
      <div class="stage">
        <video id="video" controls playsinline></video>
        <div class="box" id="box" hidden><span id="box-label"></span></div>
      </div>
      <div class="swap" id="swap" hidden>
        <h2 id="swap-title"></h2>
        <label>Product
          <input id="product" type="text" maxlength="200" placeholder="Brand product" autocomplete="off">
        </label>
        <label>Product image, optional
          <input id="product-image" type="file" accept="image/jpeg,image/png,image/webp">
        </label>
        <button type="button" class="go" id="swap-go">Replace object</button>
        <p id="swap-status"></p>
      </div>
      <div class="compare" id="compare" hidden>
        <figure>
          <figcaption>Original</figcaption>
          <video id="original" controls playsinline preload="auto"></video>
        </figure>
        <figure>
          <figcaption id="result-caption">Swapped</figcaption>
          <video id="result" controls playsinline preload="auto"></video>
        </figure>
      </div>
      <div class="objects" id="objects"></div>
    </section>
  </main>
  <script>
    const clipsEl = document.getElementById("clips");
    const objectsEl = document.getElementById("objects");
    const video = document.getElementById("video");
    const boxEl = document.getElementById("box");
    const boxLabel = document.getElementById("box-label");
    const swapEl = document.getElementById("swap");
    const swapTitle = document.getElementById("swap-title");
    const productInput = document.getElementById("product");
    const imageInput = document.getElementById("product-image");
    const swapGo = document.getElementById("swap-go");
    const swapStatus = document.getElementById("swap-status");
    const compareEl = document.getElementById("compare");
    const original = document.getElementById("original");
    const result = document.getElementById("result");
    const resultCaption = document.getElementById("result-caption");
    let clips = [];
    let selectedClip = null;
    let selectedObject = null;
    let pollToken = 0;
    let shownWindow = "";
    let shownResult = "";
    const swapsByObject = {};

    function fmt(t) {
      return (Math.round(Number(t) * 10) / 10).toFixed(1);
    }

    function rangeText(obj) {
      return fmt(obj.start_s) + "–" + fmt(obj.end_s) + "s";
    }

    function boxAt(object, time) {
      const boxes = object.boxes || [];
      if (!boxes.length) return null;
      let chosen = boxes[0];
      for (const box of boxes) {
        if (box.t <= time + 0.001) chosen = box;
      }
      return chosen;
    }

    function draw() {
      if (!selectedObject || !video.videoWidth) {
        boxEl.hidden = true;
        return;
      }
      const t = video.currentTime;
      if (t < selectedObject.start_s - 0.05 || t > selectedObject.end_s + 0.05) {
        boxEl.hidden = true;
        return;
      }
      const box = boxAt(selectedObject, t);
      if (!box) {
        boxEl.hidden = true;
        return;
      }
      boxEl.hidden = false;
      boxEl.style.left = (box.x / video.videoWidth * 100) + "%";
      boxEl.style.top = (box.y / video.videoHeight * 100) + "%";
      boxEl.style.width = (box.w / video.videoWidth * 100) + "%";
      boxEl.style.height = (box.h / video.videoHeight * 100) + "%";
      boxLabel.textContent = selectedObject.label;
    }

    function renderClips() {
      clipsEl.replaceChildren();
      if (!clips.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "No clips stored yet.";
        clipsEl.appendChild(p);
        return;
      }
      for (const clip of clips) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "clip";
        button.setAttribute("aria-pressed", selectedClip && selectedClip.id === clip.id ? "true" : "false");
        const name = document.createElement("strong");
        name.textContent = clip.name;
        const meta = document.createElement("span");
        meta.className = "meta";
        const bits = [clip.objects.length + (clip.objects.length === 1 ? " object" : " objects")];
        if (clip.cost_usd != null) bits.push("$" + Number(clip.cost_usd).toFixed(3));
        meta.textContent = bits.join(" · ");
        button.append(name, meta);
        button.addEventListener("click", () => selectClip(clip.id));
        clipsEl.appendChild(button);
      }
    }

    function renderObjects() {
      objectsEl.replaceChildren();
      if (!selectedClip) return;
      if (!selectedClip.objects.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "No swappable objects in this clip.";
        objectsEl.appendChild(p);
        return;
      }
      for (const obj of selectedClip.objects) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "obj";
        button.setAttribute("aria-pressed", selectedObject && selectedObject.id === obj.id ? "true" : "false");
        const label = document.createElement("strong");
        label.textContent = obj.label;
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = rangeText(obj);
        button.append(label, meta);
        button.addEventListener("click", () => selectObject(obj.id));
        objectsEl.appendChild(button);
      }
    }

    function money(value) {
      return "$" + Number(value).toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
    }

    function statusText(job) {
      if (job.status === "queued") return "Queued";
      if (job.status === "failed") return job.error || "Swap failed";
      if (job.status === "completed") {
        if (job.cost != null && !Number.isNaN(Number(job.cost))) {
          return "Done · " + money(job.cost);
        }
        return "Done";
      }
      if (job.detail === "cutting") return "Cutting the window";
      if (job.detail === "uploading") return "Uploading the clip";
      if (job.detail === "submitting") return "Starting the swap";
      if (job.progress != null) return "Generating " + job.progress + "%";
      return "Generating";
    }

    function showJob(job) {
      swapStatus.textContent = statusText(job);
      swapGo.disabled = job.status === "queued" || job.status === "running";
      resultCaption.textContent = job.product ? "With " + job.product : "Swapped";
      if (job.window_url && shownWindow !== job.window_url) {
        shownWindow = job.window_url;
        original.src = job.window_url;
        compareEl.hidden = false;
      }
      if (job.result_url && shownResult !== job.result_url) {
        shownResult = job.result_url;
        result.src = job.result_url;
        compareEl.hidden = false;
      }
    }

    function clearSwapView() {
      shownWindow = "";
      shownResult = "";
      compareEl.hidden = true;
      for (const player of [original, result]) {
        if (player.getAttribute("src")) {
          player.removeAttribute("src");
          player.load();
        }
      }
      swapStatus.textContent = "";
      swapGo.disabled = false;
      resultCaption.textContent = "Swapped";
    }

    async function pollSwap(id, token) {
      while (token === pollToken) {
        let job;
        try {
          const res = await fetch("/api/swaps/" + id);
          job = await res.json();
        } catch (err) {
          if (token !== pollToken) return;
          swapStatus.textContent = "Could not read the swap status";
          return;
        }
        if (token !== pollToken) return;
        if (job.error && !job.status) {
          swapStatus.textContent = job.error;
          return;
        }
        showJob(job);
        if (job.status === "completed" || job.status === "failed") return;
        await new Promise((resolve) => setTimeout(resolve, 1000));
      }
    }

    function remember(job) {
      if (job && job.object_id) swapsByObject[job.object_id] = job.id;
    }

    function selectClip(id) {
      selectedClip = clips.find((clip) => clip.id === id) || null;
      selectedObject = null;
      pollToken += 1;
      boxEl.hidden = true;
      swapEl.hidden = true;
      clearSwapView();
      if (selectedClip) {
        video.src = "/media/" + selectedClip.id;
        fetch("/api/clips/" + selectedClip.id + "/swaps")
          .then((res) => res.json())
          .then((jobs) => {
            if (!selectedClip || selectedClip.id !== id || !Array.isArray(jobs)) return;
            for (const job of jobs) remember(job);
          })
          .catch(() => {});
      }
      renderClips();
      renderObjects();
    }

    function selectObject(id) {
      if (!selectedClip) return;
      selectedObject = selectedClip.objects.find((obj) => obj.id === id) || null;
      renderObjects();
      pollToken += 1;
      clearSwapView();
      imageInput.value = "";
      if (!selectedObject) {
        swapEl.hidden = true;
        return;
      }
      swapEl.hidden = false;
      swapTitle.textContent = "Replace the " + selectedObject.label;
      productInput.value = selectedObject.suggested_product || "";
      const seek = () => {
        video.pause();
        video.currentTime = Number(selectedObject.start_s);
        draw();
      };
      if (video.readyState >= 1) seek();
      else video.addEventListener("loadedmetadata", seek, { once: true });
      const existing = swapsByObject[selectedObject.id];
      if (existing) pollSwap(existing, pollToken);
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const text = String(reader.result || "");
          const comma = text.indexOf(",");
          resolve(comma >= 0 ? text.slice(comma + 1) : text);
        };
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    async function startReplace() {
      if (!selectedClip || !selectedObject) return;
      const clipId = selectedClip.id;
      const objectId = selectedObject.id;
      const product = productInput.value.trim();
      if (!product) {
        swapStatus.textContent = "Enter a product name";
        return;
      }
      const file = imageInput.files && imageInput.files[0];
      if (file && file.size > 8000000) {
        swapStatus.textContent = "Image is too large";
        return;
      }
      const token = ++pollToken;
      swapGo.disabled = true;
      swapStatus.textContent = "Queued";
      const body = { product };
      if (file) body.image_base64 = await fileToBase64(file);
      if (token !== pollToken) return;
      let job;
      try {
        const res = await fetch(
          "/api/clips/" + clipId + "/objects/" + objectId + "/swap",
          { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
        );
        job = await res.json();
        if (!res.ok) {
          swapGo.disabled = false;
          swapStatus.textContent = job.error || "Swap failed";
          return;
        }
      } catch (err) {
        swapGo.disabled = false;
        swapStatus.textContent = "Could not start the swap";
        return;
      }
      if (token !== pollToken) return;
      remember(job);
      shownWindow = "";
      shownResult = "";
      showJob(job);
      pollSwap(job.id, token);
    }

    let leader = null;
    let echoing = false;
    function follow(from, to) {
      from.addEventListener("play", () => {
        if (echoing) return;
        leader = from;
        if (!to.getAttribute("src")) return;
        echoing = true;
        const pending = to.play();
        const release = () => { echoing = false; };
        if (pending && pending.then) pending.then(release, release);
        else release();
      });
      from.addEventListener("pause", () => {
        if (echoing || leader !== from) return;
        echoing = true;
        to.pause();
        echoing = false;
      });
      from.addEventListener("seeked", () => {
        if (echoing || leader !== from || !to.getAttribute("src")) return;
        if (Math.abs(from.currentTime - to.currentTime) > 0.05) to.currentTime = from.currentTime;
      });
      from.addEventListener("timeupdate", () => {
        if (echoing || leader !== from || from.paused || !to.getAttribute("src")) return;
        if (Math.abs(from.currentTime - to.currentTime) > 0.3) to.currentTime = from.currentTime;
      });
    }
    follow(original, result);
    follow(result, original);

    swapGo.addEventListener("click", startReplace);
    video.addEventListener("seeked", draw);
    video.addEventListener("timeupdate", draw);

    fetch("/api/clips")
      .then((res) => res.json())
      .then((data) => {
        clips = data;
        renderClips();
        if (clips.length) selectClip(clips[0].id);
      });
  </script>
</body>
</html>
